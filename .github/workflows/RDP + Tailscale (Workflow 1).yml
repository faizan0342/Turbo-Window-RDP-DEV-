name: RDP + Tailscale (Workflow 1)

on:
  workflow_dispatch:

    inputs:
      ts_tailnet:         { description: "Tailscale tailnet", required: true }
      ts_api_key:         { description: "Tailscale API key", required: true }
      ts_authkey:         { description: "Tailscale Auth key", required: true }
      quick_test:         { description: "Run 5-min test", type: boolean, default: false }
      runtime_minutes:    { description: "Runtime minutes", default: "355" }
      do_purge:           { description: "Purge bullet* devices", default: "true" }
      rdp_count:          { description: "RDP instance count", default: "1" }
      cycles_left:        { description: "Number of cycles", default: "99" }

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - id: mk
        run: |
          $n = [int]"${{ inputs.rdp_count }}"
          if($n -lt 1){$n=1}
          if($n -gt 10){$n=10}
          $arr=@()
          for($i=1; $i -le $n; $i++){ $arr+=@{id=$i} }
          $json=@{include=$arr} | ConvertTo-Json -Compress
          "matrix=$json" | Out-File $env:GITHUB_OUTPUT -Append

  rdp:
    needs: setup
    runs-on: windows-latest
    timeout-minutes: 370
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      RDP_USER: Bullettemporary
      RDP_PASS: Bullet@12345

    steps:

      # 1. Decide runtime
      - name: Decide runtime
        id: dec
        run: |
          function Yes($v){ "$v" -match '^(?i:true|1|yes|on)$' }
          $runtime = if(Yes("${{ inputs.quick_test }}")) { 5 } else { [int]"${{ inputs.runtime_minutes }}" }
          if($runtime -gt 355){ $runtime = 355 }
          "runtime=$runtime" | Out-File $env:GITHUB_OUTPUT -Append

      # 2. Install Tailscale
      - name: Install Tailscale
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.msi"
          $dst = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $url -OutFile $dst
          Start-Process msiexec.exe -ArgumentList "/i `"$dst`" /quiet /norestart" -Wait

      # 3. Login to Tailscale
      - name: Connect Tailscale
        run: |
          $ts = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"

          # Wait until installed
          while(-not(Test-Path $ts)){ Start-Sleep -Seconds 2 }

          # logout any previous session (optional)
          & $ts logout

          # login using authkey
          & $ts up --authkey "${{ inputs.ts_authkey }}" --hostname "bullet-${{ matrix.id }}" --accept-routes

          # print IP
          Write-Host "Tailscale IP:"
          & $ts ip -4

      # 4. Enable RDP and create user
      - name: Enable RDP
        run: |
          net user $env:RDP_USER $env:RDP_PASS /add
          net localgroup administrators $env:RDP_USER /add
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes

      # 5. Keep alive
      - name: Runtime wait
        run: |
          $end = (Get-Date).AddMinutes([int]"${{ steps.dec.outputs.runtime }}")
          while((Get-Date) -lt $end){
            Write-Host "RDP active - $(Get-Date)"
            Start-Sleep 60
          }

      # 6. Auto-cycle
      - name: Auto-cycle
        if: ${{ inputs.cycles_left != '0' }}
        run: |
          $next = [int]"${{ inputs.cycles_left }}" - 1
          gh workflow run "RDP + Tailscale (Workflow 1)" `
            -f ts_tailnet="${{ inputs.ts_tailnet }}" `
            -f ts_api_key="${{ inputs.ts_api_key }}" `
            -f ts_authkey="${{ inputs.ts_authkey }}" `
            -f rdp_count="${{ inputs.rdp_count }}" `
            -f do_purge="${{ inputs.do_purge }}" `
            -f runtime_minutes="${{ inputs.runtime_minutes }}" `
            -f quick_test="${{ inputs.quick_test }}" `
            -f cycles_left="$next"

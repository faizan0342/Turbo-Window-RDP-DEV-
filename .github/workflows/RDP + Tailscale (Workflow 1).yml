name: RDP + Tailscale (Workflow 1)

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:         { description: "Tailscale tailnet (example: you@gmail.com)", required: true }
      ts_api_key:         { description: "Tailscale API key (FULL tskey-api-…)", required: true }
      ts_authkey:         { description: "Tailscale Auth key (FULL tskey-auth-…)", required: true }
      quick_test:         { description: "Run 5-minute test", type: boolean, default: false }
      runtime_minutes:    { description: "Runtime minutes", default: "355" }
      do_purge:           { description: "Purge bullet* devices", default: "true" }
      rdp_count:          { description: "RDP instance count (1-10)", default: "1" }
      cycles_left:        { description: "Number of cycles", default: "99" }

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:

  # ----------------------------------------------------
  #  MATRIX SETUP
  # ----------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - id: mk
        run: |
          $n=[int]"${{ inputs.rdp_count }}"
          if($n -lt 1){$n=1}
          if($n -gt 10){$n=10}
          $arr=@()
          for($i=1;$i -le $n;$i++){
            $arr+=@{id=$i}
          }
          $json=@{include=$arr} | ConvertTo-Json -Compress
          "matrix=$json" | Out-File $env:GITHUB_OUTPUT -Append


  # ----------------------------------------------------
  #  MAIN RDP JOB
  # ----------------------------------------------------
  rdp:
    needs: setup
    runs-on: windows-latest
    timeout-minutes: 370
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      RDP_USER: Bullettemporary
      RDP_PASS: Bullet@12345

    steps:

      # ----------------------------------------------------
      # 1. Compute runtime
      # ----------------------------------------------------
      - name: Decide runtime
        id: dec
        run: |
          function Yes($v){ "$v" -match '^(?i:true|1|yes|on)$' }

          $runtime = if(Yes("${{ inputs.quick_test }}")) { 
            5 
          } else { 
            [int]"${{ inputs.runtime_minutes }}" 
          }

          if($runtime -gt 355){ $runtime = 355 }

          "runtime=$runtime" | Out-File $env:GITHUB_OUTPUT -Append
          "cycles_left=${{ inputs.cycles_left }}" | Out-File $env:GITHUB_OUTPUT -Append


      # ----------------------------------------------------
      # 2. Install Tailscale
      # ----------------------------------------------------
      - name: Install Tailscale
        run: |
          Write-Host "Downloading Tailscale..."
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "$env:USERPROFILE\tailscale.exe"

          Write-Host "Installing Tailscale..."
          Start-Process "$env:USERPROFILE\tailscale.exe" -ArgumentList "/quiet" -Wait
          Start-Sleep 6

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (!(Test-Path $ts)) {
            Write-Error "❌ Tailscale failed to install."
            exit 1
          }

          Write-Host "✅ Tailscale installed successfully."


      # ----------------------------------------------------
      # 3. Login to Tailscale
      # ----------------------------------------------------
      - name: Tailscale Login
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts logout 2>$null
          Start-Sleep 2

          Write-Host "Connecting Tailscale..."

          & $ts up `
            --authkey "${{ inputs.ts_authkey }}" `
            --hostname "bullet-${{ matrix.id }}" `
            --accept-routes `
            --accept-dns `
            --reset

          Start-Sleep 3

          & $ts ipconfig


      # ----------------------------------------------------
      # 4. Setup RDP user + enable RDP
      # ----------------------------------------------------
      - name: Setup RDP
        run: |
          net user $env:RDP_USER $env:RDP_PASS /add
          net localgroup administrators $env:RDP_USER /add

          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"


      # ----------------------------------------------------
      # 5. Run for selected time
      # ----------------------------------------------------
      - name: Runtime
        run: |
          $mins = [int]"${{ steps.dec.outputs.runtime }}"
          $end = (Get-Date).AddMinutes($mins)

          while((Get-Date) -lt $end){
            Write-Host "Heartbeat - $(Get-Date)"
            Start-Sleep 60
          }


      # ----------------------------------------------------
      # 6. Continue to Workflow 2 (auto-cycle)
      # ----------------------------------------------------
      - name: Trigger Next Cycle
        if: ${{ steps.dec.outputs.cycles_left != '0' }}
        run: |
          $next = [int]"${{ steps.dec.outputs.cycles_left }}" - 1

          $body = @{
            ref = "main"
            inputs = @{
              ts_tailnet      = "${{ inputs.ts_tailnet }}"
              ts_api_key      = "${{ inputs.ts_api_key }}"
              ts_authkey      = "${{ inputs.ts_authkey }}"
              runtime_minutes = "${{ inputs.runtime_minutes }}"
              do_purge        = "${{ inputs.do_purge }}"
              rdp_count       = "${{ inputs.rdp_count }}"
              cycles_left     = "$next"
            }
          } | ConvertTo-Json

          Invoke-WebRequest `
            -Method POST `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/workflow2.yml/dispatches" `
            -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN"; "Content-Type" = "application/json" } `
            -Body $body


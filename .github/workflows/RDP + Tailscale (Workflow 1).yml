name: RDP + Tailscale (Workflow 1)

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:         { description: "Tailscale tailnet (example: you@gmail.com)", required: true }
      ts_api_key:         { description: "Tailscale API key (FULL tskey-api-…)", required: true }
      ts_authkey:         { description: "Tailscale Auth key (FULL tskey-auth-…)", required: true }
      quick_test:         { description: "Run 5-minute test", type: boolean, default: false }
      runtime_minutes:    { description: "Runtime minutes", default: "355" }
      do_purge:           { description: "Purge bullet* devices", default: "true" }
      rdp_count:          { description: "RDP instance count (1-10)", default: "1" }
      cycles_left:        { description: "Number of cycles", default: "99" }

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - id: mk
        run: |
          $n=[int]"${{ inputs.rdp_count }}"
          if($n -lt 1){$n=1}
          if($n -gt 10){$n=10}
          $arr=@()
          for($i=1;$i -le $n;$i++){
            $arr+=@{id=$i}
          }
          $json=@{include=$arr} | ConvertTo-Json -Compress
          "matrix=$json" | Out-File $env:GITHUB_OUTPUT -Append

  rdp:
    needs: setup
    runs-on: windows-latest
    timeout-minutes: 370
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      RDP_USER: Bullettemporary
      RDP_PASS: Bullet@12345

    steps:

      # --------------------------
      # 1. Decide runtime
      # --------------------------
      - name: Decide runtime
        id: dec
        run: |
          function Yes($v){ "$v" -match '^(?i:true|1|yes|on)$' }
          $runtime = if(Yes("${{ inputs.quick_test }}")) { 5 } else { [int]"${{ inputs.runtime_minutes }}" }
          if($runtime -gt 355){ $runtime = 355 }
          "runtime=$runtime" | Out-File $env:GITHUB_OUTPUT -Append

      # --------------------------
      # 2. Install Tailscale
      # --------------------------
      - name: Install Tailscale
        run: |
          Write-Host "Downloading Tailscale installer..."
          $installer = "$env:TEMP\tailscale-installer.exe"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile $installer -UseBasicParsing

          Write-Host "Running installer..."
          Start-Process $installer -ArgumentList "/quiet" -Wait
          Start-Sleep -Seconds 8

          $ts1 = "C:\Program Files\Tailscale\tailscale.exe"
          $ts2 = "C:\Program Files (x86)\Tailscale\tailscale.exe"

          if (Test-Path $ts1) { "$ts1" | Out-File tailscale_path.txt }
          elseif (Test-Path $ts2) { "$ts2" | Out-File tailscale_path.txt }
          else { Write-Error "Tailscale FAILED to install!" }

      # --------------------------
      # 3. Login Tailscale
      # --------------------------
      - name: Login Tailscale
        run: |
          $ts = Get-Content tailscale_path.txt
          & $ts logout 2>$null
          & $ts up --authkey "${{ inputs.ts_authkey }}" `
                   --hostname "bullet-${{ matrix.id }}" `
                   --accept-routes `
                   --accept-dns
          Write-Host "Tailscale IP Address:"
          & $ts ip -4 | Select-Object -First 1

      # --------------------------
      # 4. Create RDP user and enable RDP
      # --------------------------
      - name: Enable RDP
        run: |
          net user $env:RDP_USER $env:RDP_PASS /add
          net localgroup administrators $env:RDP_USER /add
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes

      # --------------------------
      # 5. Runtime loop
      # --------------------------
      - name: Keep alive
        run: |
          $end = (Get-Date).AddMinutes([int]"${{ steps.dec.outputs.runtime }}")
          while((Get-Date) -lt $end){
            Write-Host "RDP active - $(Get-Date)"
            Start-Sleep -Seconds 60
          }

      # --------------------------
      # 6. Auto-cycle (Workflow restart)
      # --------------------------
      - name: Auto cycle trigger
        if: ${{ inputs.cycles_left != '0' }}
        run: |
          $next = [int]"${{ inputs.cycles_left }}" - 1
          gh workflow run "RDP + Tailscale (Workflow 1)" `
            -f ts_tailnet="${{ inputs.ts_tailnet }}" `
            -f ts_api_key="${{ inputs.ts_api_key }}" `
            -f ts_authkey="${{ inputs.ts_authkey }}" `
            -f rdp_count="${{ inputs.rdp_count }}" `
            -f do_purge="${{ inputs.do_purge }}" `
            -f runtime_minutes="${{ inputs.runtime_minutes }}" `
            -f quick_test="${{ inputs.quick_test }}" `
            -f cycles_left="$next"

name: RDP + Tailscale (Workflow 1)

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:         { description: "Tailscale tailnet (e.g. you@gmail.com)", required: true }
      ts_api_key:         { description: "Tailscale API key (device admin, no Bearer)", required: true }
      ts_authkey:         { description: "Tailscale Auth key", required: true }
      quick_test:         { description: "Run 5-minute test", type: boolean, default: false }
      runtime_minutes:    { description: "Runtime minutes", default: "355" }
      do_purge:           { description: "Purge bullet* devices", default: "true" }
      rdp_count:          { description: "RDP instance count (1-10)", default: "1" }
      cycles_left:        { description: "Number of cycles", default: "99" }

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - id: mk
        run: |
          $n=[int]"${{ inputs.rdp_count }}"
          if($n -lt 1){$n=1}; if($n -gt 10){$n=10}
          $arr=@(); for($i=1;$i -le $n;$i++){ $arr+=@{id=$i} }
          $json=@{include=$arr}|ConvertTo-Json -Compress
          "matrix=$json" | Out-File $env:GITHUB_OUTPUT -Append

  rdp:
    needs: setup
    runs-on: windows-latest
    timeout-minutes: 370
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      RDP_USER: Bullettemporary
      RDP_PASS: Bullet@12345

    steps:

      - name: Decide runtime
        id: dec
        run: |
          function Yes($v){ "$v" -match '^(?i:true|1|yes|on)$' }
          $runtime = if(Yes("${{ inputs.quick_test }}")) { 5 } else { [int]"${{ inputs.runtime_minutes }}" }
          "runtime=$runtime" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Install Tailscale
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup.exe" -OutFile ts.exe
          Start-Process ts.exe -ArgumentList "/quiet" -Wait

      - name: Connect Tailscale
        run: |
          tailscale up --authkey "${{ inputs.ts_authkey }}" --accept-routes --hostname "bullet${{ matrix.id }}"

      - name: Create RDP user
        run: |
          net user $env:RDP_USER $env:RDP_PASS /add
          net localgroup administrators $env:RDP_USER /add
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f

      - name: Run RDP session (auto)
        run: |
          $end = (Get-Date).AddMinutes([int]"${{ steps.dec.outputs.runtime }}")
          while((Get-Date) -lt $end){
            Write-Output "RDP active: $(Get-Date)"
            Start-Sleep -Seconds 60
          }

      - name: Auto-restart Workflow
        if: always()
        run: |
          $left = [int]"${{ inputs.cycles_left }}"
          if($left -gt 1){
            gh workflow run "RDP + Tailscale (Workflow 1)" `
              -f ts_tailnet="${{ inputs.ts_tailnet }}" `
              -f ts_api_key="${{ inputs.ts_api_key }}" `
              -f ts_authkey="${{ inputs.ts_authkey }}" `
              -f runtime_minutes="${{ inputs.runtime_minutes }}" `
              -f do_purge="${{ inputs.do_purge }}" `
              -f rdp_count="${{ inputs.rdp_count }}" `
              -f cycles_left="$($left-1)"
          }

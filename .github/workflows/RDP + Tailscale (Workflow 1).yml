name: RDP + Tailscale (Workflow 1)

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:         { description: "Tailscale tailnet (example: you@gmail.com)", required: true }
      ts_api_key:         { description: "Tailscale API key (FULL tskey-api-…)", required: true }
      ts_authkey:         { description: "Tailscale Auth key (FULL tskey-auth-…)", required: true }
      quick_test:         { description: "Run 5-minute test", type: boolean, default: false }
      runtime_minutes:    { description: "Runtime minutes", default: "355" }
      do_purge:           { description: "Purge bullet* devices", default: "true" }
      rdp_count:          { description: "RDP instance count (1-10)", default: "1" }
      cycles_left:        { description: "Number of cycles", default: "99" }

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - id: mk
        run: |
          $n=[int]"${{ inputs.rdp_count }}"
          if($n -lt 1){$n=1}
          if($n -gt 10){$n=10}
          $arr=@()
          for($i=1;$i -le $n;$i++){
            $arr+=@{id=$i}
          }
          $json=@{include=$arr} | ConvertTo-Json -Compress
          "matrix=$json" | Out-File $env:GITHUB_OUTPUT -Append

  rdp:
    needs: setup
    runs-on: windows-latest
    timeout-minutes: 370
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      RDP_USER: Bullettemporary
      RDP_PASS: Bullet@12345

    steps:

      # 1. Calculate runtime
      - name: Decide runtime
        id: dec
        run: |
          function Yes($v){ "$v" -match '^(?i:true|1|yes|on)$' }
          $runtime = if(Yes("${{ inputs.quick_test }}")) { 5 } else { [int]"${{ inputs.runtime_minutes }}" }
          if($runtime -gt 355){ $runtime = 355 }
          "runtime=$runtime" | Out-File $env:GITHUB_OUTPUT -Append

      # 2. Install Tailscale
      - name: Install Tailscale
        run: |
          $msi = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait

      # 3. Login to Tailscale
      - name: Login Tailscale
        run: |
          $ts1 = "C:\Program Files\Tailscale\tailscale.exe"
          $ts2 = "C:\Program Files (x86)\Tailscale\tailscale.exe"
          if (Test-Path $ts1) { $ts = $ts1 }
          elseif (Test-Path $ts2) { $ts = $ts2 }
          else { Write-Error "Tailscale executable not found!" ; exit 1 }

          Write-Host "Using Tailscale path: $ts"

          try { & $ts logout } catch { Write-Host "No previous session to logout" }

          & $ts up --authkey "${{ inputs.ts_authkey }}" --hostname "bullet-${{ matrix.id }}" --accept-routes --accept-dns

          Write-Host "Tailscale IP Address:"
          $ip = & $ts ip -4 | Select-Object -First 1
          Write-Host $ip

      # 4. Enable RDP and create user
      - name: Enable RDP
        run: |
          net user $env:RDP_USER $env:RDP_PASS /add
          net localgroup administrators $env:RDP_USER /add
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes

      # 5. Runtime wait (keep alive)
      - name: Wait (runtime)
        run: |
          $end = (Get-Date).AddMinutes([int]"${{ steps.dec.outputs.runtime }}")
          while((Get-Date) -lt $end){
            Write-Host "RDP active - $(Get-Date)"
            Start-Sleep 60
          }

      # 6. Auto-cycle trigger
      - name: Auto cycle trigger
        if: ${{ inputs.cycles_left != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $next = [int]"${{ inputs.cycles_left }}" - 1

          $url  = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/rdp2.yml/dispatches"
          $hdr  = @{ Authorization = "Bearer $env:GH_TOKEN"; "Accept"="application/vnd.github+json" }

          $body = @{
            ref = $env:GITHUB_REF_NAME
            inputs = @{
              ts_tailnet    = "${{ inputs.ts_tailnet }}"
              ts_api_key    = "${{ inputs.ts_api_key }}"
              ts_authkey    = "${{ inputs.ts_authkey }}"
              rdp_count     = "${{ inputs.rdp_count }}"
              do_purge      = "${{ inputs.do_purge }}"
              runtime_minutes = "${{ inputs.runtime_minutes }}"
              quick_test    = "${{ inputs.quick_test }}"
              cycles_left   = "$next"
            }
          } | ConvertTo-Json -Depth 20

          Invoke-WebRequest -Method POST -Uri $url -Headers $hdr -Body $body
